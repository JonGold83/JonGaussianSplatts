<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaussian Splatty – Jonas Goldamer</title>
<style>
  :root { --bg:#0e0f11; --card:#17191c; --line:#26292e; --text:#e6e3e0; --muted:#8a8f96; --accent:#ffaf50; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; padding:56px 16px; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:28px; font-weight:650; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:6px 0 36px; font-size:15px; }
  ul { list-style:none; display:grid; gap:10px; }
  .item { display:flex; align-items:center; gap:16px; padding:16px 18px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; cursor:pointer; transition:border-color .15s, transform .15s; }
  .item:hover { border-color:var(--accent); transform:translateY(-1px); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none; box-shadow:0 0 12px var(--accent); }
  .name { font-weight:600; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:3px; }
  .go { margin-left:auto; color:var(--muted); font-size:20px; transition:transform .2s, color .15s; }
  .item:hover .go { color:var(--accent); }
  .count { color:var(--muted); font-size:12px; border:1px solid var(--line); border-radius:20px; padding:2px 8px; }

  /* skupina */
  details summary { list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details[open] > summary { border-color:var(--accent); border-bottom-left-radius:4px; border-bottom-right-radius:4px; }
  details[open] > summary .go { transform:rotate(90deg); color:var(--accent); }
  .sublist { margin:6px 0 0 22px; padding-left:14px; border-left:1px solid var(--line); gap:6px; }
  .sublist .item { padding:12px 16px; border-radius:10px; }
  .sublist .dot { width:7px; height:7px; box-shadow:none; opacity:.7; }
  .sublist .name { font-size:15px; font-weight:500; }

  footer { color:var(--muted); font-size:12px; margin-top:40px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Gaussian Splaty</h1>
  <p class="sub">Fotogrametrické 3D modely z dronu. Align fotek v RealityCapture, trénování Gaussian splatů v LichtFeld Studiu.</p>
  <ul id="list"></ul>
  <footer>(c)Jonas Goldamer · viewer <a href="https://github.com/MrNeRF/LichtFeld-Studio" target="_blank" rel="noopener">LichtFeld Studio</a></footer>
</main>
<script>
  // Skupina: { name, meta, variants: [[nazev, popis, soubor.sog], ...] }
  // Skupina s 1 variantou = primy odkaz bez rozbaleni
  const groups = [
    { name: 'Kaple Suchdol', meta: '7. 11. 2026', variants: [
      ['Plná verze',          '4M Gaussian · SH2',    'Kaple_Suchdol-2026_11_07-GausSplat_4M_SH2_cz.sog'],
      ['v2 low poly',         '1,9M Gaussian',        'Kaple_30k_1,9_Mgaus.sog'],
      ['v2 low poly – crop',  '1,2M Gaussian',        'Kaple_30k_1,2M_gaus_CROP.sog'],
      ['v2 low – jen kaple',  '0,36M Gaussian',       'Kaple_30k_0,36Mgaus_JEN kaple.sog'],
    ]},
    { name: 'Domy nad Vltavským údolím', meta: '2 termíny', variants: [
      ['Listopad 2026',       '7. 11. 2026 · 4,5M Gaussian',  'Domy_nad_Vltavskym_udolim_2026-11-07_4-5M.sog'],
      ['Červenec 2026',       '21. 7. 2026 · 6,6M Gaussian',  'Domy_nad_Vltavskym_udolim_2026-07-21_6-6M.sog'],
    ]},
    { name: 'Stožár BTS Zlatníky', meta: '28. 8. 2026 · 2,3M Gaussian', variants: [
      ['Stožár BTS Zlatníky', '28. 8. 2026 · 2,3M Gaussian',  '2026_08_28-BTS_Zlatniky_2-3M.sog'],
    ]},
    { name: 'Liblice', meta: 'Stožáry týden před odstřelem · 7. 10. 2026', variants: [
      ['Liblice',             '7. 10. 2026',                  'Liblice_2026-10-07.sog'],
    ]},
  ];

  const url = f => `splatviewer.html?content=${encodeURIComponent(f)}`;
  const row = (n, m, extra = '') =>
    `<span class="dot"></span><span><div class="name">${n}</div><div class="meta">${m}</div></span>${extra}<span class="go">→</span>`;

  document.getElementById('list').innerHTML = groups.map(g => {
    if (g.variants.length === 1)
      return `<li><a class="item" href="${url(g.variants[0][2])}">${row(g.name, g.meta)}</a></li>`;
    return `<li><details>
      <summary class="item">${row(g.name, g.meta, `<span class="count">${g.variants.length} varianty</span>`)}</summary>
      <ul class="sublist">${g.variants.map(([n, m, f]) =>
        `<li><a class="item" href="${url(f)}">${row(n, m)}</a></li>`).join('')}</ul>
    </details></li>`;
  }).join('');
</script>
</body>
</html>
