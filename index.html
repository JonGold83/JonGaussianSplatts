<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaussian Splatty – Jonas Goldamer</title>
<style>
  :root { --bg:#0e0f11; --card:#17191c; --line:#26292e; --text:#e6e3e0; --muted:#8a8f96; --accent:#ffaf50; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; padding:56px 16px; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:28px; font-weight:650; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:6px 0 36px; font-size:15px; }
  ul { list-style:none; display:grid; gap:10px; }
  a.item { display:flex; align-items:center; gap:16px; padding:16px 18px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.item:hover { border-color:var(--accent); transform:translateY(-1px); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none; box-shadow:0 0 12px var(--accent); }
  .name { font-weight:600; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:3px; }
  .go { margin-left:auto; color:var(--muted); font-size:20px; }
  a.item:hover .go { color:var(--accent); }
  footer { color:var(--muted); font-size:12px; margin-top:40px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Gaussian Splaty</h1>
  <p class="sub">Fotogrametrické 3D modely z dronu. Align fotek pomocí Reality Capture Desktop. Trénovaní Gaussian splattů v Lichtfield Studio. </p>
  <ul id="list"></ul>
  <footer>Jonas Goldamer · viewer <a href="https://github.com/MrNeRF/LichtFeld-Studio" target="_blank" rel="noopener">LichtFeld Studio</a></footer>
</main>
<script>
  // Pridani splatu: dalsi radek [nazev, popis, soubor.sog]
  const splats = [
    ['Kaple Suchdol',                 '7. 11. 2026, 4M Gaussian',   'Kaple_Suchdol-2026_11_07-GausSplat_4M_SH2_cz.sog'],
    ['Kaple Suchdol v2 low poly',           '7. 11. 2026, 1,9M Gaussian',   'Kaple_30k_1,9_Mgaus.sog'],
    ['Kaple Suchdol v2 low poly CROP',      '7. 11. 2026, 1,2M Gaussian',   'Kaple_30k_1,2M_gaus_CROP.sog'],
    ['Domy nad Vltavským údolím 2026/11 ','4,5M Gaussian- 7. 11. 2026 ', 'Domy_nad_Vltavskym_udolim_2026-11-07_4-5M.sog'],
    ['Domy nad Vltavským údolím 2026/07',     '21. 7. 2026 · 6,6M Gaussian', 'Domy_nad_Vltavskym_udolim_2026-07-21_6-6M.sog'],
    ['Stožár BTS Zlatníky',           '28. 8. 2026 · 2,3M Gaussian', '2026_08_28-BTS_Zlatniky_2-3M.sog'],
    ['Liblice_2026/10',           'Stožáry Liblice, týden před odstřelem,  2026-10-07', 'Liblice_2026-10-07.sog'],
  ];
  document.getElementById('list').innerHTML = splats.map(([n, m, f]) =>
    `<li><a class="item" href="splatviewer.html?content=${encodeURIComponent(f)}">
       <span class="dot"></span><span><div class="name">${n}</div><div class="meta">${m}</div></span>
       <span class="go">→</span></a></li>`).join('');
</script>
</body>
</html>
