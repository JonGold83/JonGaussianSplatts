<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaussian Splatty – Jonas Goldamer</title>
<style>
  :root { --bg:#0e0f11; --card:#17191c; --line:#26292e; --text:#e6e3e0; --muted:#8a8f96; --accent:#ffaf50; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; padding:56px 16px; }
  main { max-width:720px; margin:0 auto; position:relative; }
  h1 { font-size:28px; font-weight:650; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:6px 0 36px; font-size:15px; }
  ul { list-style:none; display:grid; gap:10px; }
  .item { display:flex; align-items:center; gap:16px; padding:16px 18px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; cursor:pointer; transition:border-color .15s, transform .15s; }
  .item:hover { border-color:var(--accent); transform:translateY(-1px); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none; box-shadow:0 0 12px var(--accent); }
  .name { font-weight:600; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:3px; }
  .go { margin-left:auto; color:var(--muted); font-size:20px; transition:transform .2s, color .15s; }
  .item:hover .go { color:var(--accent); }
  .count { color:var(--muted); font-size:12px; border:1px solid var(--line); border-radius:20px; padding:2px 8px; }
  /* štítek „nové“ (přidáno/nahrazeno za posledních NEW_HOURS hodin podle history.json) */
  .new[hidden] { display:none; }
  .new { cursor:help; display:inline-block; margin-left:8px; padding:1px 7px; border-radius:20px; font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; vertical-align:2px; color:var(--bg); background:var(--accent); }
  /* ikona nadirového modelu (hover = vysvětlení) */
  .nadir { display:inline-flex; margin-left:6px; vertical-align:-2px; color:var(--muted); cursor:help; }
  .nadir svg { width:15px; height:15px; }
  .item:hover .nadir { color:var(--accent); }
  /* velikost souboru (doplní se z hlavičky Content-Length) */
  .size { white-space:nowrap; }
  /* hlavička skupiny a položky s náhledem: tlumený náhled v pozadí, při najetí barevně */
  summary.item, .item.hasbg { position:relative; overflow:hidden; }
  summary.item > :not(.gbg), .item.hasbg > :not(.gbg) { position:relative; }
  .gbg { position:absolute; inset:0 0 0 35%; background-size:cover; background-position:center; filter:grayscale(1); opacity:.16;
    -webkit-mask-image:linear-gradient(to right, transparent, #000 60%); mask-image:linear-gradient(to right, transparent, #000 60%); transition:opacity .3s, filter .3s; pointer-events:none; }
  summary.item:hover .gbg, .item.hasbg:hover .gbg { filter:none; opacity:.32; }

  /* skupina */
  details summary { list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  summary.item { transition:border-color .15s, transform .15s, border-bottom-left-radius .22s ease, border-bottom-right-radius .22s ease; }
  details[open] > summary { border-color:var(--accent); border-bottom-left-radius:4px; border-bottom-right-radius:4px; }
  details[open] > summary .go { transform:rotate(90deg); color:var(--accent); }
  .sublist { margin:6px 0 0 22px; padding-left:14px; border-left:1px solid var(--line); gap:6px; }
  .sublist .item { padding:12px 16px; border-radius:10px; }
  .sublist .dot { width:7px; height:7px; box-shadow:none; opacity:.7; }
  .sublist .name { font-size:15px; font-weight:500; }
  /* jemná animace rozbalení: výška (Chrome/Edge 131+, jinde okamžitě) + varianty se zprůhledna posunou o pár px */
  :root { interpolate-size:allow-keywords; }
  details::details-content { block-size:0; overflow:clip; overflow-clip-margin:4px; transition:block-size .22s ease, content-visibility .22s allow-discrete; }
  details[open]::details-content { block-size:auto; }
  details[open] .sublist > li { animation:slideIn .22s ease both; }
  details[open] .sublist > li:nth-child(2) { animation-delay:.03s; }
  details[open] .sublist > li:nth-child(3) { animation-delay:.06s; }
  details[open] .sublist > li:nth-child(4) { animation-delay:.09s; }
  details[open] .sublist > li:nth-child(n+5) { animation-delay:.12s; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-4px); } }
  .go { transition:transform .22s ease, color .15s; }
  @media (prefers-reduced-motion: reduce) {
    details::details-content { transition:none; }
    details[open] .sublist > li { animation:none; }
  }
  /* položka (nový viewer, viewer2/ SuperSplat) + tlačítko do staršího vieweru (LichtFeld) */
  .pair { display:flex; gap:6px; align-items:stretch; }
  .pair > .item:first-child { flex:1; min-width:0; }
  .alt { flex:none; display:flex; align-items:center; justify-content:center; text-align:center; width:56px; padding:6px 4px; font-size:11px; line-height:1.25; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:10px; text-decoration:none; transition:border-color .15s, color .15s; }
  .alt:hover { border-color:var(--accent); color:var(--accent); }
  @media (max-width:520px) { .alt { width:48px; font-size:10px; } }

  footer { color:var(--muted); font-size:12px; margin-top:40px; }
  footer a { color:var(--muted); }

  /* prepinac nebe */
  .toolbar { display:flex; justify-content:flex-end; align-items:center; gap:18px; margin:-20px 0 12px; }
  /* přepínač jazyka CZ | EN */
  .lang { position:absolute; top:-36px; right:0; display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .lang button { background:none; border:0; padding:4px 9px; font:inherit; font-size:12px; letter-spacing:.06em; color:var(--muted); cursor:pointer; transition:color .15s, background .15s; }
  .lang button + button { border-left:1px solid var(--line); }
  .lang button:hover { color:var(--text); }
  .lang button[aria-pressed="true"] { color:var(--bg); background:var(--accent); }
  .lang button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .switch { display:inline-flex; align-items:center; gap:10px; cursor:pointer; color:var(--muted); font-size:14px; user-select:none; }
  .switch input { position:absolute; opacity:0; width:0; height:0; }
  .track { width:38px; height:22px; border-radius:11px; background:var(--line); position:relative; transition:background .15s; flex:none; }
  .track::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--muted); transition:transform .15s, background .15s; }
  .switch input:checked + .track { background:rgba(255,175,80,.35); }
  .switch input:checked + .track::after { transform:translateX(16px); background:var(--accent); }
  .switch input:focus-visible + .track { outline:2px solid var(--accent); outline-offset:2px; }
  .switch .state { color:var(--text); min-width:2.2em; }

  /* historie */
  .hist { margin-top:22px; }
  .hist-toggle { background:none; border:0; padding:0; color:var(--muted); font:inherit; font-size:12px; letter-spacing:.08em; cursor:pointer; opacity:.7; }
  .hist-toggle:hover, .hist-toggle[aria-expanded="true"] { opacity:1; color:var(--text); }
  .hist-log { margin-top:12px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
  .hist-row { display:grid; grid-template-columns:auto auto minmax(0,1fr) minmax(0,1.2fr) minmax(0,2fr); gap:4px 12px; padding:6px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .hist-row .when { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hist-row .act { white-space:nowrap; }
  .hist-row .act.add { color:var(--accent); }
  .hist-row .hname { color:var(--text); }
  .hist-row .file { overflow-wrap:anywhere; font-family:ui-monospace,Consolas,monospace; font-size:11px; }
  .hist-row.removed .hname, .hist-row.removed .file { text-decoration:line-through; opacity:.7; }
  @media (max-width:600px) {
    .hist-row { grid-template-columns:auto 1fr; }
    .hist-row .file { grid-column:1 / -1; }
  }
</style>
</head>
<body>
<main>
  <div class="lang" id="langSwitch" role="group"><button type="button" data-lang="cs">CZ</button><button type="button" data-lang="en">EN</button></div>
  <h1 id="h1">Gaussian Splaty z dronu</h1>
  <p class="sub" id="sub">3D modely staveb a krajiny z leteckých snímků. Rekonstrukce v RealityScanu, trénování splatů v LichtFeld Studiu.</p>
  <div class="toolbar">
    <label class="switch">
      <span id="skyLabel">Zobrazení nebe</span>
      <input type="checkbox" id="sky">
      <span class="track"></span>
      <span class="state" id="skyState">off</span>
    </label>
  </div>
  <ul id="list"></ul>
  <div class="hist">
    <button class="hist-toggle" id="histToggle" aria-expanded="false" aria-controls="histLog">HISTORIE</button>
    <div class="hist-log" id="histLog" hidden></div>
  </div>
  <footer id="footer">(c)Jonas Goldamer · viewer <a href="https://github.com/playcanvas/supersplat-viewer" target="_blank" rel="noopener">SuperSplat</a> · starší viewer <a href="https://github.com/MrNeRF/LichtFeld-Studio" target="_blank" rel="noopener">LichtFeld Studio</a></footer>
</main>
<script>
  // Skupina: { name, meta, variants: [[nazev, popis, soubor.sog], ...] }
  // Skupina s 1 variantou = primy odkaz bez rozbaleni
  const groups = [
    { name: 'Kostel Levý Hradec', meta: 'Kostel sv. Klimenta a hřbitov', variants: [
      ['Kostel a hřbitov', '4,6M Gaussian · SH1 · 30k iter · 319 snímků', 'Kostel_Levy_Hradec_319cam_4,6M_SH1_30k-iter.sog'],
      ['Kostel',           '4,7M Gaussian · 30k iter',                   'Kostel_Levy_Hradec_4,7M_30k-iter_clean.sog'],
      ['Kostel – low density', '1,8M Gaussian · SH1 · 30k iter',           'Kostel_Levy_Hradec_LowDensity_1,8M_SH1_30k-iter.sog'],
    ]},
    { name: 'Kaple Suchdol', meta: '7. 11. 2026', variants: [
      ['Plná verze',          '4M Gaussian · SH2',    'Kaple_Suchdol-2026_11_07-GausSplat_4M_SH2_cz.sog'],
      ['Kaple – 3,9M',        '3,9M Gaussian · SH1 · 30k iter', 'Kaple_Suchdol_3,9M_SH1_30k-iter.sog'],
      ['Kaple – low density', '0,8M Gaussian · SH1 · 30k iter', 'Kaple_Suchdol_LowDensity_0,8M_SH1_30k-iter.sog'],
      ['v2 low density',         '1,9M Gaussian',        'Kaple_30k_1,9_Mgaus.sog'],
      ['v2 low density – crop',  '1,2M Gaussian',         'Kaple_30k_1,2M_gaus_CROP.sog'],
      ['v2 low – jen kaple',  '0,36M Gaussian',       'Kaple_30k_0,36Mgaus_JEN kaple.sog'],
    ]},
    { name: 'Stožár BTS Klecany', meta: 'Plná verze · low density', variants: [
      ['Stožár BTS Klecany', '4,4M Gaussian · SH1 · 30k iter', 'Klecany_Stozar_BTS_4,4M_SH1_30k-iter.sog'],
      ['Stožár BTS Klecany – low density', '0,9M Gaussian · SH1 · 30k iter', 'Klecany_Stozar_BTS_LowDensity_0,9M_SH1_30k-iter.sog'],
    ]},
    { name: 'Hřbitov Suchdol', meta: 'Plná verze · low density', nadir: true, variants: [
      ['Hřbitov Suchdol', '4,0M Gaussian · SH1 · 30k iter', 'Hrbitov_Suchdol_4,0M_SH1_30k-iter.sog'],
      ['Hřbitov Suchdol – low density', '0,8M Gaussian · SH1 · 30k iter', 'Hrbitov_Suchdol_LowDensity_0,8M_SH1_30k-iter.sog'],
    ]},
    { name: 'Stavby a deponie', meta: 'Deponie Horoměřice · Stavba školy · Stavba Klecany 11', collapse: true, variants: [
      ['Deponie Horoměřice', '4,5M Gaussian · SH1 · 30k iter', 'Hromady_Horomerice_4,5M_SH1_30k-iter.sog'],
      ['Deponie Horoměřice – low density', '0,9M Gaussian · SH1 · 30k iter', 'Hromady_Horomerice_LowDensity_0,9M_SH1_30k-iter.sog'],
      ['Stavba školy', '4,0M Gaussian · SH1 · 30k iter', 'Stavba_Skola_4,0M_SH1_30k-iter.sog', { nadir: true }],
      ['Stavba školy – low density', '0,8M Gaussian · SH1 · 30k iter', 'Stavba_Skola_LowDensity_0,8M_SH1_30k-iter.sog', { nadir: true }],
      ['Stavba Klecany 11', '4,1M Gaussian · SH1 · 30k iter', 'Stavba_Klecany11_4,1M_SH1_30k-iter.sog', { nadir: true }],
      ['Stavba Klecany 11 – low density', '0,8M Gaussian · SH1 · 30k iter', 'Stavba_Klecany11_LowDensity_0,8M_SH1_30k-iter.sog', { nadir: true }],
    ]},
    { name: 'Rodinné domy', meta: 'Karel · Klekle 2 · Halouny', variants: [
      ['Karel',    '4,4M Gaussian · SH1 · 30k iter',           'Karel_Dum_4,4M_SH1_30k-iter.sog'],
      ['Karel – low density', '0,9M Gaussian · SH1 · 30k iter', 'Karel_Dum_LowDensity_0,9M_SH1_30k-iter.sog'],
      ['Klekle 2', '4,3M Gaussian · SH1 · 30k iter',           'Klekle2_4,3M_SH1_30k-iter.sog'],
      ['Klekle 2 – low density', '1,8M Gaussian · SH1 · 30k iter', 'Klekle2_LowDensity_1,8M_SH1_30k-iter.sog'],
      ['Halouny',  '4,5M Gaussian · SH1 · 30k iter',           'Halouny_Dum_4,5M_SH1_30k-iter.sog'],
      ['Halouny – low density', '0,9M Gaussian · SH1 · 30k iter', 'Halouny_Dum_LowDensity_0,9M_SH1_30k-iter.sog'],
    ]},
    { name: 'Domy nad Vltavským údolím', meta: '2 termíny', variants: [
      ['Listopad 2026 – high density', '7. 11. 2026 · 6M Gaussian',            'Domy_nad_Vltavskym_udolim_2026-11-07_6M_high_density.sog'],
      ['Listopad 2026',                '7. 11. 2026 · 4,5M Gaussian',          'Domy_nad_Vltavskym_udolim_2026-11-07_4-5M.sog'],
      ['Listopad 2026 – low density',  '7. 11. 2026 · 2M Gaussian · 90k iter', 'Domy_nad_Vltavskym_udolim_2026-11-07_2M_low_dendisty.sog'],
      ['Červenec 2026',                '21. 7. 2026 · 6,6M Gaussian',          'Domy_nad_Vltavskym_udolim_2026-07-21_6-6M.sog'],
    ]},
    { name: 'Stožár BTS Zlatníky', meta: '28. 8. 2026', variants: [
      ['Stožár BTS Zlatníky', '28. 8. 2026 · 3,5M Gaussian · SH1 · 30k iter', 'Stozar_BTS_Zlatniky_3,5M_SH1_30k-iter.sog'],
      ['Stožár BTS Zlatníky – low density', '0,8M Gaussian · SH1 · 30k iter', 'Stozar_BTS_Zlatniky_LowDensity_0,8M_SH1_30k-iter.sog'],
    ]},
    { name: 'Liblice', meta: 'Stožáry týden před odstřelem · 7. 10. 2026', variants: [
      ['Liblice – 3,3M',      '3,3M Gaussian · SH1 · 30k iter', 'Liblice_3,3M_SH1_30k-iter.sog'],
      ['Liblice – low density', '0,7M Gaussian · SH1 · 30k iter', 'Liblice_LowDensity_0,7M_SH1_30k-iter.sog'],
    ]},
  ];

  // ---------- Jazyk (CZ / EN) ----------
  // Pořadí: ?lang= v adrese > ruční volba (localStorage 'lang') > jazyk prohlížeče (cs/sk = CZ, jinak EN)
  const LANGS = ['cs', 'en'];
  const pickLang = () => {
    const p = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(p)) return p;
    try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch (e) {}
    const nav = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']);
    return nav.some(l => /^(cs|sk)\b/i.test(l)) ? 'cs' : 'en';
  };
  let lang = pickLang();

  // Texty stránky
  const T = {
    cs: {
      docTitle: 'Gaussian Splaty z dronu – Jonas Goldamer',
      h1: 'Gaussian Splaty z dronu',
      sub: '3D modely staveb a krajiny z leteckých snímků. Rekonstrukce v RealityScanu, trénování splatů v LichtFeld Studiu.',
      sky: 'Zobrazení nebe',
      langTitle: 'Jazyk / Language',
      hist: 'HISTORIE',
      histErr: 'Historii se nepodařilo načíst.',
      footer: '(c)Jonas Goldamer · viewer {ss} · starší viewer {lf}',
      openNew: v => `Otevřít model v prohlížeči (SuperSplat Viewer ${v})`,
      openOld: 'Otevřít model ve starším prohlížeči (LichtFeld Studio)',
      oldBtn: 'starší<br>viewer',
      nadir: d => `Nadirový model: snímaný jen shora, proto kamera nejde sklopit níž než ${d}° pod horizont.`,
      badge: 'nové',
      newOne: span => `Model nově nahraný nebo aktualizovaný během posledních ${span}`,
      newAny: span => `Skupina obsahuje model nově nahraný nebo aktualizovaný během posledních ${span}`,
      hours: h => h % 24 ? `${h} hodin` : h === 24 ? '24 hodin' : `${h / 24} dní`,
      count: n => `${n} ${n === 1 ? 'varianta' : n < 5 ? 'varianty' : 'variant'}`,
      acts: { 'přidáno': 'přidáno', 'nahrazeno': 'nahrazeno', 'odstraněno': 'odstraněno' },
      date: d => { const [y, m, day] = d.split('-'); return `${+day}. ${+m}. ${y}`; },
    },
    en: {
      docTitle: 'Drone Gaussian Splats – Jonas Goldamer',
      h1: 'Drone Gaussian Splats',
      sub: '3D models of buildings and landscapes from aerial photos. Reconstruction in RealityScan, splat training in LichtFeld Studio.',
      sky: 'Sky background',
      langTitle: 'Jazyk / Language',
      hist: 'HISTORY',
      histErr: 'Could not load the history.',
      footer: '(c)Jonas Goldamer · viewer {ss} · legacy viewer {lf}',
      openNew: v => `Open the model in the viewer (SuperSplat Viewer ${v})`,
      openOld: 'Open the model in the legacy viewer (LichtFeld Studio)',
      oldBtn: 'legacy<br>viewer',
      nadir: d => `Nadir model: captured from above only, so the camera cannot tilt lower than ${d}° below the horizon.`,
      badge: 'new',
      newOne: span => `Model added or updated in the last ${span}`,
      newAny: span => `This group contains a model added or updated in the last ${span}`,
      hours: h => h % 24 ? `${h} hours` : h === 24 ? '24 hours' : `${h / 24} days`,
      count: n => `${n} ${n === 1 ? 'variant' : 'variants'}`,
      acts: { 'přidáno': 'added', 'nahrazeno': 'replaced', 'odstraněno': 'removed' },
      date: d => { const [y, m, day] = d.split('-'); return `${+day} ${MONTHS_EN[+m - 1]} ${y}`; },
    },
  };
  const MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // Anglické názvy: celé texty nebo jejich části oddělené „ – “ a „ · “ (český text = klíč).
  // Co ve slovníku není, zůstane česky; čísla (4,6M), data (7. 11. 2026) a „snímků“ se převedou samy.
  // Nová položka = doplnit sem anglický název (vlastní jména míst se nepřekládají).
  const EN = {
    // skupiny a jejich popisky
    'Kostel Levý Hradec': 'Church of St. Clement, Levý Hradec',
    'Kostel sv. Klimenta a hřbitov': 'Church of St. Clement and cemetery',
    'Kaple Suchdol': 'Chapel, Suchdol',
    'Stožár BTS Klecany': 'BTS tower, Klecany',
    'Hřbitov Suchdol': 'Cemetery, Suchdol',
    'Stavby a deponie': 'Construction sites & spoil heaps',
    'Rodinné domy': 'Family houses',
    'Domy nad Vltavským údolím': 'Domy nad Vltavským údolím',
    '2 termíny': 'Real estate project · 2 survey dates',
    'Stožár BTS Zlatníky': 'BTS tower, Zlatníky',
    'Stožáry týden před odstřelem': 'Towers one week before demolition',
    'Plná verze': 'Full version',
    // varianty
    'Kostel a hřbitov': 'Church and cemetery',
    'Kostel': 'Church',
    'Kaple': 'Chapel',
    'jen kaple': 'chapel only',
    'Deponie Horoměřice': 'Spoil heaps, Horoměřice',
    'Stavba školy': 'School construction site',
    'Stavba Klecany 11': 'Construction site, Klecany 11',
    'Listopad 2026': 'November 2026',
    'Červenec 2026': 'July 2026',
  };
  const enAuto = s => s
    .replace(/\b(\d{1,2})\. ?(\d{1,2})\. ?(\d{4})\b/g, (_, d, m, y) => `${+d} ${MONTHS_EN[+m - 1]} ${y}`)
    .replace(/(\d),(\d)/g, '$1.$2')
    .replace(/(\d+) snímků/g, '$1 photos');
  const tr = s => {
    if (lang === 'cs' || s == null) return s;
    if (EN[s] !== undefined) return EN[s];
    return s.split(/( – | · )/).map((part, i) => i % 2 ? part : (EN[part] ?? enAuto(part))).join('');
  };
  const t = () => T[lang];

  // ---------- Odkazy do viewerů ----------
  // Panorama oblohy pro pozadí vieweru; přepínač „Zobrazení nebe“ ji zapíná/vypíná (vypnuto = černé pozadí)
  const SKYBOX = 'nebe_4k.jpg';
  const skyInput = document.getElementById('sky');
  try { const s = localStorage.getItem('skybox'); if (s !== null) skyInput.checked = s === '1'; } catch (e) {}
  // title = název zobrazený v horní liště vieweru (viewer-topbar.js), lang = jazyk lišty a vieweru
  const url = (f, ti) => `splatviewer.html?content=${encodeURIComponent(f)}` +
    (ti ? `&title=${encodeURIComponent(ti)}` : '') + `&lang=${lang}` +
    (skyInput.checked ? `&skybox=${encodeURIComponent(SKYBOX)}` : '');
  // nový viewer v podsložce viewer2/: cesty k souborům jsou o úroveň výš
  // minpitch: kamera v novém vieweru hledí vždy aspoň tolik stupňů dolů pod horizont.
  // Všechny modely 15° (ať se nekouká odspodu); modely jen z nadirových fotek (nadir: true
  // u skupiny nebo { nadir: true } jako 4. položka varianty) 55°.
  const MINPITCH = 15, MINPITCH_NADIR = 55;
  const mpOf = (g, opt) => ((opt && opt.nadir) || g.nadir) ? MINPITCH_NADIR : MINPITCH;
  const url2 = (f, ti, mp) => `viewer2/?content=${encodeURIComponent('../' + f)}` +
    (ti ? `&title=${encodeURIComponent(ti)}` : '') + (mp ? `&minpitch=${mp}` : '') + `&lang=${lang}` +
    (skyInput.checked ? `&skybox=${encodeURIComponent('../' + SKYBOX)}` : '');
  // hlavní odkaz = nový viewer (SuperSplat), tlačítko vpravo = starší viewer (LichtFeld)
  const VIEWER2_VERSION = '1.44.0'; // při přechodu na novou verzi vieweru přepsat
  const attr = s => String(s).replace(/"/g, '&quot;');
  const alt = (f, ti) => `<a class="alt" data-v="1" data-f="${f}" data-t="${ti}" title="${attr(t().openOld)}">${t().oldBtn}</a>`;
  // náhled modelu: thumbs/<soubor>.jpg (barevný 4:1, první snímek úvodní animace); chybějící obrázek se prostě nezobrazí
  const thumbUrl = f => `thumbs/${encodeURIComponent(f.replace(/\.sog$/, '.jpg'))}`;
  const isNadir = (g, opt) => !!((opt && opt.nadir) || g.nadir);
  const nadirIcon = () => `<span class="nadir" title="${attr(t().nadir(MINPITCH_NADIR))}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v6M5.5 5 8 7.5 10.5 5"/><path d="M2 11.5 8 9l6 2.5L8 14z"/></svg></span>`;
  // f = soubor (náhled, velikost, „nové“), nadir = ikona
  const gbg = f => f ? `<span class="gbg" style="background-image:url('${thumbUrl(f)}')"></span>` : '';
  const row = (n, m, extra = '', f = '', nadir = false) =>
    `${gbg(f)}<span class="dot"></span><span><div class="name">${n}${nadir ? nadirIcon() : ''}${f ? `<span class="new" data-new="${f}" hidden>${t().badge}</span>` : ''}</div>` +
    `<div class="meta">${m}${f ? `<span class="size" data-size="${f}"></span>` : ''}</div></span>${extra}<span class="go">→</span>`;

  // ---------- Seznam modelů ----------
  const list = document.getElementById('list');
  // Rozbalené skupiny si pamatuje sessionStorage, aby zůstaly otevřené po návratu z vieweru (klíč = český název)
  let openGroups = [];
  try { openGroups = JSON.parse(sessionStorage.getItem('openGroups') || '[]'); } catch (e) {}
  const sizes = new Map(); // soubor -> bajty (HEAD), ať se při přepnutí jazyka nenačítají znovu
  const fmtSize = b => b >= 1e6 ? `${Math.round(b / 1e6)} MB` : `${Math.max(1, Math.round(b / 1e3))} kB`;
  const loadSizes = root => root.querySelectorAll('.size[data-size]:empty').forEach(async el => {
    const f = el.dataset.size;
    try {
      if (!sizes.has(f)) sizes.set(f, fetch(f, { method: 'HEAD' }).then(r => +r.headers.get('Content-Length')));
      const len = await sizes.get(f);
      if (len) el.textContent = ` · ${fmtSize(len)}`;
    } catch (e) {}
  });

  // Štítek „nové“: soubory přidané/nahrazené za posledních NEW_HOURS hodin (history.json)
  const NEW_HOURS = 24;
  let historyRows = null;
  const loadHistory = () => historyRows ??= fetch('history.json', { cache: 'no-cache' }).then(r => r.json());
  const markNew = () => loadHistory().then(rows => {
    const since = Date.now() - NEW_HOURS * 36e5;
    const fresh = new Set(rows.filter(r => (r.akce === 'přidáno' || r.akce === 'nahrazeno') &&
      new Date(`${r.datum}T${r.cas || '00:00'}`).getTime() >= since).map(r => r.soubor));
    const span = t().hours(NEW_HOURS);
    list.querySelectorAll('.new').forEach(el => el.title = el.dataset.newAny ? t().newAny(span) : t().newOne(span));
    list.querySelectorAll('[data-new]').forEach(el => el.hidden = !fresh.has(el.dataset.new));
    list.querySelectorAll('[data-new-any]').forEach(el => el.hidden = !el.dataset.newAny.split('|').some(f => fresh.has(f)));
  }).catch(() => {});

  const renderList = () => {
    const newTitle = attr(t().openNew(VIEWER2_VERSION));
    list.innerHTML = groups.map(g => {
      const gName = tr(g.name), gMeta = tr(g.meta);
      if (g.variants.length === 1 && !g.collapse)
        return `<li class="pair"><a class="item hasbg" data-v="2" data-mp="${mpOf(g, g.variants[0][3])}" title="${newTitle}" data-f="${g.variants[0][2]}" data-t="${attr(gName)}">${row(gName, gMeta, '', g.variants[0][2], isNadir(g, g.variants[0][3]))}</a>${alt(g.variants[0][2], attr(gName))}</li>`;
      const files = g.variants.map(v => v[2]).join('|');
      return `<li><details data-g="${attr(g.name)}"${openGroups.includes(g.name) ? ' open' : ''}>
        <summary class="item">${gbg(g.variants[0][2])}${row(gName + `<span class="new" data-new-any="${attr(files)}" hidden>${t().badge}</span>`, gMeta, `<span class="count">${t().count(g.variants.length)}</span>`)}</summary>
        <ul class="sublist">${g.variants.map(([n, m, f, opt]) => {
          const vName = tr(n), full = `${gName} – ${vName}`;
          return `<li class="pair"><a class="item hasbg" data-v="2" data-mp="${mpOf(g, opt)}" title="${newTitle}" data-f="${f}" data-t="${attr(full)}">${row(vName, tr(m), '', f, isNadir(g, opt))}</a>${alt(f, attr(full))}</li>`;
        }).join('')}</ul>
      </details></li>`;
    }).join('');
    list.querySelectorAll(':scope > li.pair').forEach(loadSizes);
    list.querySelectorAll('details[data-g]').forEach(d => {
      if (d.open) loadSizes(d);
      d.addEventListener('toggle', () => {
        if (d.open) loadSizes(d);
        openGroups = [...list.querySelectorAll('details[data-g]')].filter(x => x.open).map(x => x.dataset.g);
        try { sessionStorage.setItem('openGroups', JSON.stringify(openGroups)); } catch (e) {}
      });
    });
    markNew();
    refresh();
  };

  // Odkazy si pamatují soubor v data-f; přepínač jen přepíše href (rozbalené skupiny zůstanou otevřené)
  const refresh = () => {
    list.querySelectorAll('a[data-f]').forEach(a => a.href = (a.dataset.v === '2' ? url2 : url)(a.dataset.f, a.dataset.t, a.dataset.mp));
    document.getElementById('skyState').textContent = skyInput.checked ? 'on' : 'off';
  };

  // ---------- Historie změn: history.json (nejnovější nahoře), načte se až po rozbalení ----------
  const histToggle = document.getElementById('histToggle');
  const histLog = document.getElementById('histLog');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const renderHistory = async () => {
    try {
      const rows = await loadHistory();
      histLog.innerHTML = rows.map(r => `<div class="hist-row${r.akce === 'odstraněno' ? ' removed' : ''}">
        <span class="when">${esc(t().date(r.datum))} ${esc(r.cas)}</span>
        <span class="act${r.akce === 'přidáno' ? ' add' : ''}">${esc(t().acts[r.akce] ?? r.akce)}</span>
        <span class="cat">${esc(tr(r.kategorie))}</span>
        <span class="hname">${esc(tr(r.nazev))}</span>
        <span class="file">${esc(r.soubor)}</span>
      </div>`).join('');
    } catch (e) {
      histLog.textContent = t().histErr;
    }
  };
  histToggle.addEventListener('click', () => {
    const open = histLog.hidden;
    histLog.hidden = !open;
    histToggle.setAttribute('aria-expanded', open);
    if (open) renderHistory();
  });

  // ---------- Texty stránky + přepínač jazyka ----------
  const applyLang = () => {
    document.documentElement.lang = lang;
    document.title = t().docTitle;
    document.getElementById('h1').textContent = t().h1;
    document.getElementById('sub').textContent = t().sub;
    document.getElementById('skyLabel').textContent = t().sky;
    histToggle.textContent = t().hist;
    document.getElementById('footer').innerHTML = t().footer
      .replace('{ss}', '<a href="https://github.com/playcanvas/supersplat-viewer" target="_blank" rel="noopener">SuperSplat</a>')
      .replace('{lf}', '<a href="https://github.com/MrNeRF/LichtFeld-Studio" target="_blank" rel="noopener">LichtFeld Studio</a>');
    document.querySelectorAll('#langSwitch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    renderList();
    if (!histLog.hidden) renderHistory();
  };
  document.getElementById('langSwitch').title = T.cs.langTitle;
  document.querySelectorAll('#langSwitch button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem('lang', lang); } catch (e) {}
    // ?lang= v adrese by při obnovení stránky přebil volbu – odstraní se
    const u = new URL(location.href);
    if (u.searchParams.has('lang')) { u.searchParams.delete('lang'); history.replaceState(null, '', u); }
    applyLang();
  }));

  skyInput.addEventListener('change', () => {
    try { localStorage.setItem('skybox', skyInput.checked ? '1' : '0'); } catch (e) {}
    refresh();
  });
  applyLang();
</script>
</body>
</html>
